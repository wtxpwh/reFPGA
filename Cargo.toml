[workspace]
resolver = "3"
members = [
  "docgen",
  # public crates: CLI
  "public/cli",
  "public/coolrunner2",
  "public/ecp",  # public crates: generic infrastructure
  "public/entity",
  "public/interconnect",
  "public/jed",
  # public crates: per target
  "public/siliconblue",
  "public/spartan6",
  "public/tablegen",
  "public/types",
  "public/ultrascale",
  "public/versal",
  "public/virtex",
  "public/virtex2",
  "public/virtex4",
  "public/xc2000",
  "public/xc9500",
  "public/xpla3",
  "re/collector",
  "re/fpga-hammer",
  "re/hammer",
  "re/harvester",
  # RE crates: SiliconBlue
  "re/icecube-harvester",
  # RE crates: Lattice
  "re/lattice/dump",
  "re/lattice/finish",
  "re/lattice/naming",
  "re/lattice/rawdump",
  "re/lattice/rd2geom",
  "re/sdf",
  # RE crates: generic infrastructure
  "re/toolchain",
  # RE crates: Xilinx CPLD
  "re/xilinx/cpld",
  "re/xilinx/finish",
  "re/xilinx/geom",
  "re/xilinx/ise-dump",
  "re/xilinx/ise-hammer",
  "re/xilinx/naming",
  "re/xilinx/naming/spartan6",
  "re/xilinx/naming/ultrascale",
  "re/xilinx/naming/versal",
  "re/xilinx/naming/virtex",
  "re/xilinx/naming/virtex2",
  "re/xilinx/naming/virtex4",
  "re/xilinx/naming/xc2000",
  # RE crates: Xilinx FPGA
  "re/xilinx/rawdump",
  "re/xilinx/rd2db/grid",
  "re/xilinx/rd2db/interconnect",
  "re/xilinx/rd2db/spartan6",
  "re/xilinx/rd2db/ultrascale",
  "re/xilinx/rd2db/versal",
  "re/xilinx/rd2db/virtex",
  "re/xilinx/rd2db/virtex2",
  "re/xilinx/rd2db/virtex4",
  "re/xilinx/rd2db/virtex5",
  "re/xilinx/rd2db/virtex6",
  "re/xilinx/rd2db/virtex7",
  "re/xilinx/rd2db/xc4000",
  "re/xilinx/rd2db/xc5200",
  "re/xilinx/rd2geom",
  "re/xilinx/rdbuild",
  "re/xilinx/rdverify",
  "re/xilinx/rdverify/spartan6",
  "re/xilinx/rdverify/ultrascale",
  "re/xilinx/rdverify/versal",
  "re/xilinx/rdverify/virtex",
  "re/xilinx/rdverify/virtex2",
  "re/xilinx/rdverify/virtex4",
  "re/xilinx/rdverify/virtex5",
  "re/xilinx/rdverify/virtex6",
  "re/xilinx/rdverify/virtex7",
  "re/xilinx/rdverify/xc4000",
  "re/xilinx/rdverify/xc5200",
  "re/xilinx/v2xdl-verify",
  "re/xilinx/vivado-dump",
  "re/xilinx/xact/data",
  "re/xilinx/xact/dump",
  "re/xilinx/xact/geom",
  "re/xilinx/xact/hammer",
  "re/xilinx/xact/naming",
  "re/xilinx/xact/xc2000",
  "re/xilinx/xdl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://codeberg.org/prjunnamed/prjcombine"
license = "0BSD OR Apache-2.0"

[workspace.dependencies]
aes = "0.9.1"
arrayref = "0.3.6"
arrayvec = "0.7.6"
assert_matches = "1.5"
bimap = "0.6"
bincode = "2.0"
bitvec = "1.0"
bytes = "1.8.0"
cbc = "0.2.1"
clap = { version = "4.1", features = ["derive"] }
derive-where = "1.2"
des = "0.9.0"
flate2 = "1.0"
hex = "0.4.3"
indexmap = "2"
indicatif = "0.18"
itertools = "0.15"
kdl = { version = "6.7", default-features = false }
ndarray = "0.17"
nix = { version = "0.31", features = ["fs"] }
prjcombine-coolrunner2 = { path = "public/coolrunner2" }
prjcombine-ecp = { path = "public/ecp" }
# public crates and their dependencies
prjcombine-entity = { path = "public/entity", features = ["bincode", "bitvec", "map"] }
prjcombine-interconnect = { path = "public/interconnect" }
prjcombine-jed = { path = "public/jed" }
prjcombine-re-collector = { path = "re/collector" }
prjcombine-re-fpga-hammer = { path = "re/fpga-hammer" }
