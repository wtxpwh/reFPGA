prjcombine-re-xilinx-xact-data = { path = "re/xilinx/xact/data" }
prjcombine-re-xilinx-xact-geom = { path = "re/xilinx/xact/geom" }
prjcombine-re-xilinx-xact-naming = { path = "re/xilinx/xact/naming" }
